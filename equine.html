<script>
  // Auto-fill phone from URL parameter
  const urlParams = new URLSearchParams(window.location.search);
  document.getElementById('ownerPhone').value = urlParams.get('phone') || '';

  let horseCount = 0;

  function addHorseCard() {
    horseCount++;
    const div = document.createElement('div');
    div.className = 'horse-block';
    div.id = `horse_${horseCount}`;
    div.innerHTML = `
      ${horseCount > 1 ? `<button type="button" class="remove-btn" onclick="removeHorse(${horseCount})">✖ Remove</button>` : ''}
      <div style="font-weight: bold; color: #128C7E; font-size: 15px;">Horse #${horseCount} Profile</div>

      <div class="section-title">📇 Basic Information</div>
      <label>Horse Name *</label>
      <input type="text" class="h-name" required placeholder="e.g. Rani">

      <label>Microchip / Passport ID / Tag *</label>
      <input type="text" class="h-chip" required placeholder="e.g. Poon123">

      <div class="row">
        <div>
          <label>Gender *</label>
          <select class="h-gender" required>
            <option value="Stallion">Stallion</option>
            <option value="Mare" selected>Mare</option>
            <option value="Gelding">Gelding</option>
          </select>
        </div>
        <div>
          <label>Age / Date of Birth</label>
          <input type="text" class="h-age" placeholder="e.g. 5 Years">
        </div>
      </div>

      <div class="section-title">🧬 Breed & Appearance</div>
      <div class="row">
        <div>
          <label>Breed</label>
          <select class="h-breed">
            <option value="Marwari">Marwari</option>
            <option value="Kathiawari">Kathiawari</option>
            <option value="Nukra">Nukra</option>
            <option value="Indian Half-Bred" selected>Indian Half-Bred</option>
            <option value="Thoroughbred">Thoroughbred</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label>Coat Colour</label>
          <input type="text" class="h-color" placeholder="e.g. Bay / Grey / Chestnut">
        </div>
      </div>

      <label>Distinguishing Markings</label>
      <input type="text" class="h-markings" placeholder="e.g. White blaze on face, rear white socks">

      <div class="section-title">🩺 Required Medical Tests</div>
      <div class="checkbox-group">
        <div class="checkbox-item"><input type="checkbox" class="t-glanders" checked> Glanders (CFT)</div>
        <div class="checkbox-item"><input type="checkbox" class="t-coggins" checked> EIA (Coggins Test)</div>
        <div class="checkbox-item"><input type="checkbox" class="t-flu"> Equine Influenza</div>
        <div class="checkbox-item"><input type="checkbox" class="t-surra"> Surra (T. evansi)</div>
      </div>

      <label style="margin-top:10px;">Other Test / Special Instructions</label>
      <input type="text" class="t-other" placeholder="e.g. Complete Blood Count / Parasitology">
    `;
    document.getElementById('horseList').appendChild(div);
  }

  function removeHorse(id) {
    document.getElementById(`horse_${id}`).remove();
  }

  // Guaranteed load handler for 1st horse card
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addHorseCard);
  } else {
    addHorseCard();
  }

  document.getElementById('equineForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = "Submitting...";
    submitBtn.disabled = true;

    const horses = [];
    document.querySelectorAll('.horse-block').forEach(card => {
      horses.push({
        name: card.querySelector('.h-name').value || 'Horse',
        microchip: card.querySelector('.h-chip').value || 'N/A',
        gender: card.querySelector('.h-gender').value,
        age: card.querySelector('.h-age').value || 'N/A',
        breed: card.querySelector('.h-breed').value,
        color: card.querySelector('.h-color').value || 'N/A',
        markings: card.querySelector('.h-markings').value || 'None',
        glanders: card.querySelector('.t-glanders').checked,
        coggins: card.querySelector('.t-coggins').checked,
        flu: card.querySelector('.t-flu').checked,
        surra: card.querySelector('.t-surra').checked,
        otherTests: card.querySelector('.t-other').value || ''
      });
    });

    const payload = {
      ownerName: document.getElementById('ownerName').value,
      phone: document.getElementById('ownerPhone').value,
      altPhone: document.getElementById('altPhone').value || '',
      onsiteRx: document.getElementById('onsitePrescription').checked,
      horses: horses
    };

    try {
      const response = await fetch('https://pvd-api-723223019183.asia-south1.run.app/api/register-equine-camp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const resData = await response.json();

      if (response.ok && resData.success) {
        alert('🎉 Registration Successful! Digital Pass sent to your WhatsApp.');
        window.close();
      } else {
        alert('Server Response: ' + (resData.error || 'Check Google Sheet or WhatsApp pass.'));
      }
    } catch (err) {
      console.error('Submission Catch Error:', err);
      alert('Connection Error: Could not establish link to Cloud Run. Please check Cloud Shell logs.');
    } finally {
      submitBtn.innerText = "Submit & Get WhatsApp Pass";
      submitBtn.disabled = false;
    }
  });
</script>
