<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVD India Diagnostics - Request Diagnostic Visit</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
    .card { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .header { background: #056543; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-top: 15px; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .btn { width: 100%; padding: 14px; background: #056543; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; }
    .btn:disabled { background: #88a89c; }
    .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .checkbox-item { display: flex; align-items: center; gap: 10px; font-weight: normal; font-size: 14px; }
    .checkbox-item input { width: auto; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2 style="margin:0; font-size: 20px;">PVD India Diagnostics</h2>
    <p style="margin:5px 0 0 0; font-size: 12px; opacity:0.9;">Doorstep Sample Collection Request</p>
  </div>

  <form id="pvdBookingForm">
    <label>1. Customer Name *</label>
    <input type="text" id="customer_name" placeholder="Enter Full Name" required>

    <div style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label>Role *</label>
        <select id="user_role" required>
          <option value="Farmer">Farmer</option>
          <option value="Veterinarian">Veterinarian</option>
          <option value="Pet Owner">Pet Owner</option>
          <option value="Dairy Manager">Dairy Manager</option>
        </select>
      </div>
      <div style="flex:1;">
        <label>Animal Category *</label>
        <select id="animal_type" required>
          <option value="Cattle (Cow/Buffalo)">Cattle (Cow/Buffalo)</option>
          <option value="Pet (Dog/Cat)">Pet (Dog/Cat)</option>
          <option value="Goat/Sheep">Goat/Sheep</option>
          <option value="Poultry">Poultry</option>
        </select>
      </div>
    </div>

    <label>Tag / Microchip / Pet Name (Optional)</label>
    <input type="text" id="cow_id" placeholder="e.g. Bruno / Tag #48291">

    <label>2. Required Sample / Test Category *</label>
    <div class="checkbox-group">
      <label class="checkbox-item"><input type="checkbox" value="Milk Culture & Mastitis"> Milk Culture & Mastitis Screening</label>
      <label class="checkbox-item"><input type="checkbox" value="Blood & Metabolic Profile"> Blood & Metabolic Profile</label>
      <label class="checkbox-item"><input type="checkbox" value="Fertility & Hormonal Check"> Fertility & Hormonal Check</label>
      <label class="checkbox-item"><input type="checkbox" value="Dung & Parasitic Analysis"> Dung & Parasitic Analysis</label>
      <label class="checkbox-item"><input type="checkbox" value="Viral PCR / General Diagnostic"> Viral PCR / General Diagnostic</label>
    </div>

    <label>3. Pickup Address *</label>
    <textarea id="address" rows="3" placeholder="Village / Landmark / House No" required></textarea>

    <div style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label>Preferred Date *</label>
        <input type="date" id="visit_date" required>
      </div>
      <div style="flex:1;">
        <label>Time Slot *</label>
        <select id="visit_slot" required>
          <option value="Morning (9am - 12pm)">Morning (9am - 12pm)</option>
          <option value="Afternoon (12pm - 4pm)">Afternoon (12pm - 4pm)</option>
          <option value="Evening (4pm - 7pm)">Evening (4pm - 7pm)</option>
        </select>
      </div>
    </div>

    <button type="button" id="submitBtn" class="btn" onclick="submitBookingLead()">Request Diagnostic Callback</button>
  </form>
</div>

<script>
  // Set default date to today
  document.getElementById('visit_date').valueAsDate = new Date();

  async function submitBookingLead() {
    const name = document.getElementById('customer_name').value.trim();
    const address = document.getElementById('address').value.trim();
    const role = document.getElementById('user_role').value;
    const animal = document.getElementById('animal_type').value;
    const cowId = document.getElementById('cow_id').value.trim() || 'N/A';
    const visitDate = document.getElementById('visit_date').value;
    const visitSlot = document.getElementById('visit_slot').value;

    if (!name || !address) {
      alert("Please fill in Customer Name and Address.");
      return;
    }

    const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
    const selectedCategories = Array.from(checkboxes).map(cb => cb.value);

    if (selectedCategories.length === 0) {
      alert("Please select at least one sample category.");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "⏳ Submitting Request...";

    const urlParams = new URLSearchParams(window.location.search);
    const farmerPhone = urlParams.get('phone') || urlParams.get('bsuid') || '919373194945';

    const payload = {
      customer_name: name,
      phone_number: farmerPhone,
      user_role: role,
      animal_type: animal,
      cow_id: cowId,
      selected_test_ids: selectedCategories,
      address: address,
      pincode: '412307',
      visit_date: visitDate,
      visit_slot: visitSlot,
      bsuid: farmerPhone
    };

    try {
      const response = await fetch('https://pvd-api-142133401500.asia-south1.run.app/api/book-pvd-sample', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok && data.success) {
        alert("🎉 Request Submitted!\n\nReference Code: " + data.booking.booking_reference + "\n\nOur PVD diagnostic coordinator will call you shortly to confirm sample pickup.");
        window.location.href = "https://wa.me/919921272285";
      } else {
        alert("⚠️ Error: " + (data.error || "Unable to submit request."));
      }
    } catch (err) {
      alert("❌ Connection Error: Unable to reach PVD server.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Request Diagnostic Callback";
    }
  }
</script>

</body>
</html>
