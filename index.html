<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVD India - Diagnostic Sample Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
    <!-- Header -->
    <div class="bg-emerald-700 text-white p-4 sticky top-0 z-10 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg">PVD India Diagnostics</h1>
        <p class="text-xs text-emerald-100">Doorstep Sample Collection</p>
      </div>
      <span class="bg-emerald-800 text-xs px-2.5 py-1 rounded-full border border-emerald-600">WhatsApp Webview</span>
    </div>

    <!-- Form Body -->
    <form id="bookingForm" class="p-4 space-y-5 flex-1">
      
      <!-- Context Details -->
      <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-200 text-xs space-y-1">
        <div class="flex justify-between">
          <span class="text-gray-600">Pincode:</span>
          <span id="displayPincode" class="font-semibold text-emerald-800">Reading...</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600">Phone Number:</span>
          <span id="displayPhone" class="font-semibold text-emerald-800">Reading...</span>
        </div>
      </div>

      <!-- Step 1: Customer Profile -->
      <div class="space-y-3">
        <h2 class="font-semibold text-sm text-emerald-900 border-b pb-1">1. Contact & Animal Profile</h2>
        
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Full Name *</label>
          <input type="text" id="customer_name" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" placeholder="Enter your full name">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Role *</label>
            <select id="user_role" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-emerald-500">
              <option value="Farmer">Farmer</option>
              <option value="Veterinarian">Veterinarian</option>
              <option value="Clinic">Clinic / Dairy</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Animal Type *</label>
            <select id="animal_type" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-emerald-500">
              <option value="Cattle">Cattle (Cow/Buffalo)</option>
              <option value="Pet">Pet (Dog/Cat)</option>
              <option value="SmallRuminant">Goat / Sheep</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Cow / Animal Tag ID (Optional)</label>
          <input type="text" id="cow_id" class="w-full p-2.5 text-sm border rounded-lg" placeholder="e.g. COW-PVD-88912">
        </div>
      </div>

      <!-- Step 2: Diagnostic Catalog -->
      <div class="space-y-3">
        <h2 class="font-semibold text-sm text-emerald-900 border-b pb-1">2. Select Diagnostic Tests</h2>
        
        <div class="space-y-2 text-xs">
          <label class="flex items-center justify-between p-3 border rounded-lg hover:bg-emerald-50 cursor-pointer">
            <div class="flex items-center">
              <input type="checkbox" name="test" value="TEST-MAST-01" data-price="450" class="test-checkbox text-emerald-600 rounded w-4 h-4">
              <span class="ml-2 font-medium">Udder Milk Culture & Sensitivity</span>
            </div>
            <span class="font-bold text-emerald-700">₹450</span>
          </label>

          <label class="flex items-center justify-between p-3 border rounded-lg hover:bg-emerald-50 cursor-pointer">
            <div class="flex items-center">
              <input type="checkbox" name="test" value="TEST-FERT-02" data-price="850" class="test-checkbox text-emerald-600 rounded w-4 h-4">
              <span class="ml-2 font-medium">Bovine Fertility & Hormonal Panel</span>
            </div>
            <span class="font-bold text-emerald-700">₹850</span>
          </label>

          <label class="flex items-center justify-between p-3 border rounded-lg hover:bg-emerald-50 cursor-pointer">
            <div class="flex items-center">
              <input type="checkbox" name="test" value="TEST-BLOD-03" data-price="650" class="test-checkbox text-emerald-600 rounded w-4 h-4">
              <span class="ml-2 font-medium">Complete Blood & Metabolic Profile</span>
            </div>
            <span class="font-bold text-emerald-700">₹650</span>
          </label>
        </div>

        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border font-bold text-sm">
          <span>Total Package Amount:</span>
          <span id="totalAmountDisplay" class="text-emerald-700 text-base font-extrabold">₹0</span>
        </div>
      </div>

      <!-- Step 3: Schedule & Location -->
      <div class="space-y-3">
        <h2 class="font-semibold text-sm text-emerald-900 border-b pb-1">3. Schedule & Doorstep Location</h2>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Pickup Address *</label>
          <textarea id="address" rows="2" required class="w-full p-2.5 text-sm border rounded-lg" placeholder="Village / House No / Farm landmark"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Visit Date *</label>
            <input type="date" id="visit_date" required class="w-full p-2 text-sm border rounded-lg">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Time Slot *</label>
            <select id="visit_slot" required class="w-full p-2 text-sm border rounded-lg">
              <option value="09:00 AM - 12:00 PM">Morning (9am - 12pm)</option>
              <option value="02:00 PM - 05:00 PM">Afternoon (2pm - 5pm)</option>
            </select>
          </div>
        </div>

        <button type="button" id="geoBtn" class="w-full py-2.5 bg-gray-800 hover:bg-gray-900 text-white text-xs font-medium rounded-lg flex items-center justify-center space-x-2">
          <span>📍 Capture Live GPS Location</span>
        </button>
        <p id="geoStatus" class="text-xs text-center text-gray-500">Location required for phlebotomist dispatch.</p>
      </div>

      <!-- Consent -->
      <div class="flex items-start space-x-2 text-xs text-gray-600">
        <input type="checkbox" id="consent_given" required class="mt-0.5 rounded text-emerald-600">
        <label for="consent_given">I confirm sample details and consent to PVD diagnostic lab terms.</label>
      </div>

      <!-- Error Message Banner -->
      <div id="errorMsg" class="hidden p-3 bg-red-50 text-red-700 border border-red-200 text-xs rounded-lg"></div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-lg shadow-md transition">
        Confirm & Book Sample Pickup
      </button>
    </form>
  </div>

<script>
  // Catalog price map
  const TEST_PRICES = {
    'TEST-MAST-01': 450,
    'TEST-FERT-02': 850,
    'TEST-BLOD-03': 650,
    'TEST-PCR-04': 1200,
    'TEST-PARA-05': 300
  };

  // Function to calculate and update total amount live
  function updateTotalAmount() {
    let total = 0;
    const checkboxes = document.querySelectorAll('.test-checkbox:checked');
    checkboxes.forEach(cb => {
      const price = TEST_PRICES[cb.value] || 0;
      total += price;
    });
    document.getElementById('total-amount').innerText = `₹${total}`;
  }

  // Attach event listeners to all test checkboxes
  document.querySelectorAll('.test-checkbox').forEach(cb => {
    cb.addEventListener('change', updateTotalAmount);
  });

  // Extract URL Parameters
  const urlParams = new URLSearchParams(window.location.search);
  const pincode = urlParams.get('pincode') || '412307';
  const phoneRaw = urlParams.get('phone') || '9373194945';
  const phone = phoneRaw.replace(/\D/g, '').slice(-10);
  const bsuid = urlParams.get('bsuid') || `91${phone}`;

  // Pre-select test if passed in URL (e.g., ?test=TEST-FERT-02)
  const preselectedTest = urlParams.get('test');
  if (preselectedTest) {
    const targetCheckbox = document.querySelector(`.test-checkbox[value="${preselectedTest}"]`);
    if (targetCheckbox) {
      targetCheckbox.checked = true;
    }
  }

  // Initial calculation on page load
  updateTotalAmount();

  // Form Submission Handler
  document.getElementById('booking-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const selectedCheckboxes = document.querySelectorAll('.test-checkbox:checked');
    if (selectedCheckboxes.length === 0) {
      alert('Please select at least one diagnostic test.');
      return;
    }

    const selectedTestIds = Array.from(selectedCheckboxes).map(cb => cb.value);

    const payload = {
      customer_name: document.getElementById('customer_name').value.trim(),
      phone_number: phone,
      bsuid: bsuid,
      user_role: document.getElementById('user_role').value,
      pincode: pincode,
      address: document.getElementById('address').value.trim(),
      animal_type: document.getElementById('animal_type').value,
      cow_id: document.getElementById('cow_id').value.trim(),
      selected_test_ids: selectedTestIds,
      visit_date: document.getElementById('visit_date').value,
      visit_slot: document.getElementById('visit_slot').value,
      latitude: window.userLat || 18.5204,
      longitude: window.userLng || 73.8567,
      consent_given: document.getElementById('consent_given').checked
    };

    try {
      const response = await fetch('https://pvd-api-142133401500.asia-south1.run.app/api/book-pvd-sample', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      if (result.success) {
        alert(`Booking Confirmed! Order Ref: ${result.booking.booking_reference}`);
        if (window.TelegramWebviewProxy || window.isWhatsAppWebview) {
          window.close();
        }
      } else {
        alert(`Booking Error: ${result.error}`);
      }
    } catch (err) {
      alert('Network error submitting booking. Please try again.');
    }
  });
</script>
</body>
</html>
