<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVD India Diagnostics - Request Sample Visit</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
    .card { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .header { background: #056543; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; position: relative; }
    .lang-switcher { position: absolute; top: 12px; right: 12px; }
    .lang-switcher select { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; }
    label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-top: 15px; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .btn { width: 100%; padding: 14px; background: #056543; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; }
    .btn:disabled { background: #88a89c; }
    .gps-btn { width: 100%; padding: 10px; background: #1a365d; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; margin-top: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .checkbox-item { display: flex; align-items: center; gap: 10px; font-weight: normal; font-size: 14px; }
    .checkbox-item input { width: auto; }
    .hidden-field { display: none; margin-top: 8px; }
    .status-msg { font-size: 12px; color: #2b6cb0; margin-top: 4px; font-weight: 500; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="lang-switcher">
      <select id="languageSelect" onchange="switchLanguage(this.value)">
        <option value="en">English</option>
        <option value="mr">मराठी</option>
        <option value="hi">हिंदी</option>
      </select>
    </div>
    <h2 id="titleText" style="margin:0; font-size: 18px;">PVD India Diagnostics</h2>
    <p id="subtitleText" style="margin:5px 0 0 0; font-size: 12px; opacity:0.9;">Doorstep Sample Collection Request</p>
  </div>

  <form id="pvdBookingForm">
    <label id="lblCustomerName">1. Customer Name *</label>
    <input type="text" id="customer_name" placeholder="Enter Full Name" required>

    <div style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label id="lblRole">Role *</label>
        <select id="user_role" onchange="toggleOtherInput('user_role', 'role_other_container')" required>
          <option value="Farmer" id="optFarmer">Farmer</option>
          <option value="Veterinarian" id="optVet">Veterinarian</option>
          <option value="Pet Owner" id="optPetOwner">Pet Owner</option>
          <option value="Other" id="optRoleOther">Other</option>
        </select>
        <div id="role_other_container" class="hidden-field">
          <input type="text" id="role_other_text" placeholder="Specify Your Role">
        </div>
      </div>

      <div style="flex:1;">
        <label id="lblAnimalType">Animal Type *</label>
        <select id="animal_type" onchange="toggleOtherInput('animal_type', 'animal_other_container')" required>
          <option value="Cattle (Cow/Buffalo)" id="optCattle">Cattle (Cow/Buffalo)</option>
          <option value="Pet (Dog/Cat)" id="optPet">Pet (Dog/Cat)</option>
          <option value="Goat/Sheep" id="optGoat">Goat/Sheep</option>
          <option value="Other" id="optAnimalOther">Other</option>
        </select>
        <div id="animal_other_container" class="hidden-field">
          <input type="text" id="animal_other_text" placeholder="Specify Animal Name">
        </div>
      </div>
    </div>

    <label id="lblTag">Tag / Microchip / Pet Name (Optional)</label>
    <input type="text" id="cow_id" placeholder="e.g. Bruno / Tag #48291">

    <label id="lblTests">2. Required Sample / Test Types *</label>
    <div class="checkbox-group">
      <label class="checkbox-item"><input type="checkbox" value="Udder Milk Culture & Sensitivity"> <span id="t1">Udder Milk Culture & Sensitivity</span></label>
      <label class="checkbox-item"><input type="checkbox" value="Complete Blood & Metabolic Profile"> <span id="t2">Complete Blood & Metabolic Profile</span></label>
      <label class="checkbox-item"><input type="checkbox" value="Bovine Fertility & Hormonal Panel"> <span id="t3">Bovine Fertility & Hormonal Panel</span></label>
      <label class="checkbox-item"><input type="checkbox" value="Fecal Parasitic & Dung Analysis"> <span id="t4">Fecal Parasitic & Dung Analysis</span></label>
      <label class="checkbox-item"><input type="checkbox" value="RT-PCR Screening for Viral Pathogens"> <span id="t5">RT-PCR Screening for Viral Pathogens</span></label>
      <label class="checkbox-item"><input type="checkbox" id="chkOtherTest" value="Other" onchange="toggleTestOtherInput()"> <span id="tOther">Other / Custom Test</span></label>
    </div>
    <div id="test_other_container" class="hidden-field">
      <input type="text" id="test_other_text" placeholder="Specify required test name or symptoms">
    </div>

    <label id="lblAddress">3. Schedule Pickup Location *</label>
    <textarea id="address" rows="3" placeholder="Village / Landmark / House No" required></textarea>
    
    <!-- GPS LOCATION PICKER -->
    <button type="button" class="gps-btn" onclick="captureGPSLocation()">
      <span>📍</span> <span id="gpsBtnText">Capture Live GPS Location (Google Maps)</span>
    </button>
    <div id="gpsStatus" class="status-msg"></div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label id="lblDate">Preferred Date *</label>
        <input type="date" id="visit_date" required>
      </div>
      <div style="flex:1;">
        <label id="lblSlot">Time Slot *</label>
        <select id="visit_slot" required>
          <option value="Morning (9am - 12pm)" id="slot1">Morning (9am - 12pm)</option>
          <option value="Afternoon (12pm - 4pm)" id="slot2">Afternoon (12pm - 4pm)</option>
          <option value="Evening (4pm - 7pm)" id="slot3">Evening (4pm - 7pm)</option>
        </select>
      </div>
    </div>

    <button type="button" id="submitBtn" class="btn" onclick="submitBookingLead()">Request Sample Visit</button>
  </form>
</div>

<script>
  // Default visit date to today
  document.getElementById('visit_date').valueAsDate = new Date();

  let capturedLat = "";
  let capturedLng = "";

  function captureGPSLocation() {
    const gpsStatus = document.getElementById('gpsStatus');
    const addressBox = document.getElementById('address');

    if (!navigator.geolocation) {
      gpsStatus.innerText = "❌ Geolocation is not supported by your browser.";
      return;
    }

    gpsStatus.innerText = "⏳ Fetching live GPS location...";

    navigator.geolocation.getCurrentPosition(
      (position) => {
        capturedLat = position.coords.latitude.toFixed(6);
        capturedLng = position.coords.longitude.toFixed(6);
        const mapUrl = `https://maps.google.com/?q=${capturedLat},${capturedLng}`;

        gpsStatus.innerText = `✅ GPS Coordinates Captured (${capturedLat}, ${capturedLng})`;
        
        if (!addressBox.value.includes('maps.google.com')) {
          addressBox.value = addressBox.value.trim() 
            ? `${addressBox.value.trim()}\n\n📍 GPS Location: ${mapUrl}`
            : `📍 GPS Location: ${mapUrl}`;
        }
      },
      (error) => {
        console.error("GPS Error:", error);
        gpsStatus.innerText = "⚠️ Location permission denied. Please enter address manually.";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function toggleOtherInput(selectId, containerId) {
    const val = document.getElementById(selectId).value;
    const container = document.getElementById(containerId);
    container.style.display = (val === 'Other') ? 'block' : 'none';
  }

  function toggleTestOtherInput() {
    const chk = document.getElementById('chkOtherTest');
    const container = document.getElementById('test_other_container');
    container.style.display = chk.checked ? 'block' : 'none';
  }
async function submitBookingLead() {
    const nameInput = document.getElementById('customer_name');
    const addressInput = document.getElementById('address');
    
    const name = nameInput ? nameInput.value.trim() : '';
    const address = addressInput ? addressInput.value.trim() : '';

    if (!name || !address) {
      alert("Please fill in Customer Name and Pickup Address.");
      return;
    }

    let role = document.getElementById('user_role').value;
    if (role === 'Other') {
      role = document.getElementById('role_other_text').value.trim() || 'Other';
    }

    let animal = document.getElementById('animal_type').value;
    if (animal === 'Other') {
      animal = document.getElementById('animal_other_text').value.trim() || 'Other';
    }

    const cowId = document.getElementById('cow_id').value.trim() || 'N/A';
    const visitDate = document.getElementById('visit_date').value;
    const visitSlot = document.getElementById('visit_slot').value;

    const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
    let selectedCategories = Array.from(checkboxes).map(cb => cb.value);

    if (document.getElementById('chkOtherTest') && document.getElementById('chkOtherTest').checked) {
      const customTestName = document.getElementById('test_other_text').value.trim();
      selectedCategories = selectedCategories.filter(item => item !== 'Other');
      selectedCategories.push(customTestName ? `Custom Test: ${customTestName}` : 'Custom Diagnostic Request');
    }

    if (selectedCategories.length === 0) {
      alert("Please select at least one required test type.");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "⏳ Submitting...";

    const urlParams = new URLSearchParams(window.location.search);
    const farmerPhone = urlParams.get('phone') || urlParams.get('bsuid') || '919373194945';

    const payload = {
      customer_name: name,
      farmerName: name,
      phone_number: farmerPhone,
      phone: farmerPhone,
      user_role: role,
      animal_type: animal,
      animalType: animal,
      cow_id: cowId,
      tagNo: cowId,
      selected_test_ids: selectedCategories,
      testTypes: selectedCategories,
      address: address,
      pincode: '412307',
      visit_date: visitDate,
      preferredDate: visitDate,
      visit_slot: visitSlot,
      preferredTimeSlot: visitSlot,
      latitude: capturedLat || '',
      longitude: capturedLng || '',
      bsuid: farmerPhone
    };

    try {
      const response = await fetch('https://pvd-api-142193401500.asia-south1.run.app/api/book-pvd-sample', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok && data.success) {
        const refId = data.bookingId || (data.booking ? data.booking.booking_reference : "Confirmed");
        alert("🎉 Request Submitted!\n\nBooking ID: " + refId + "\n\nConfirmation sent to your WhatsApp!");
        window.location.href = "https://wa.me/919373194945";
      } else {
        alert("⚠️ Notice: " + (data.error || "Request recorded. Check WhatsApp for confirmation."));
        window.location.href = "https://wa.me/919373194945";
      }
    } catch (err) {
      console.error("Submission Error:", err);
      alert("🎉 Request Submitted! Your confirmation is being delivered to your WhatsApp.");
      window.location.href = "https://wa.me/919373194945";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Request Sample Visit";
    }
  }
  </script>
</body>
</html>
